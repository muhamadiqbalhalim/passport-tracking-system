<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../style.css" />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
      }

      .header {
        background: white;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
      }

      .card {
        background: white;
        padding: 20px;
        border-radius: 15px;
      }

      .card h2 {
        margin-top: 10px;
      }

      .activity {
        background: white;
        padding: 20px;
        border-radius: 15px;
        margin-top: 20px;
      }

      .log-item {
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
      }

      .log-item:last-child {
        border-bottom: none;
      }

      .btn {
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .logout {
        background: red;
        color: white;
      }

      .logs-btn {
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 12px;
        border-radius: 8px;
        display: inline-block;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Passport Monitoring Dashboard</h1>

        <div id="adminInfo"></div>
      </div>

      <div class="stats">
        <div class="card">
          <p>Total Passports</p>
          <h2 id="total">0</h2>
        </div>

        <div class="card">
          <p>Available</p>
          <h2 id="available">0</h2>
        </div>

        <div class="card">
          <p>Taken</p>
          <h2 id="taken">0</h2>
        </div>
      </div>

      <div class="activity">
        <h2>Current Passport Holders</h2>

        <div id="holders">Loading...</div>
      </div>

      <div class="activity">
        <h2>Latest Activities</h2>

        <div id="activities">Loading...</div>

        <a href="logs.html" class="logs-btn"> View Full Logs </a>
      </div>

      <br />

      <button id="logoutBtn" class="btn logout">Logout</button>
    </div>

    <script type="module">
      import { db, collection, getDocs } from "../firebase.js";

      const currentUser = JSON.parse(localStorage.getItem("passportUser"));

      if (!currentUser || currentUser.role !== "admin") {
        window.location.href = "staff-dashboard.html";
      }

      document.getElementById("adminInfo").innerHTML = `

<strong>
${currentUser.name}
</strong>

<br>

Department:
${currentUser.department}

`;

      // ====================
      // INVENTORY
      // ====================

      const inventorySnapshot = await getDocs(
        collection(db, "passport_inventory"),
      );

      let total = 0;
      let available = 0;
      let taken = 0;

      let holdersHtml = "";

      inventorySnapshot.forEach((doc) => {
        const data = doc.data();

        total++;

        if (data.status === "Available") {
          available++;
        }

        if (data.status === "Taken") {
          taken++;

          holdersHtml += `

<div class="log-item">

<strong>
${data.passportNo}
</strong>

<br>

Taken By:
${data.takenBy}

<br>

ID:
${data.takenStaffId || "-"}

<br>

Department:
${data.department || "-"}

</div>

`;
        }
      });

      document.getElementById("total").innerText = total;

      document.getElementById("available").innerText = available;

      document.getElementById("taken").innerText = taken;

      document.getElementById("holders").innerHTML =
        holdersHtml || "No passport currently taken";

      // ====================
      // LOGS
      // ====================

      const logsSnapshot = await getDocs(collection(db, "passport_logs"));

      let logsHtml = "";

      const logs = [];

      logsSnapshot.forEach((doc) => {
        logs.push(doc.data());
      });

      logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      logs.slice(0, 10).forEach((data) => {
        logsHtml += `

<div class="log-item">

<strong>
${data.staffName}
</strong>

(${data.staffId})

<br>

${data.action}

Passport:
${data.passportNo}

<br>

${new Date(data.timestamp).toLocaleString()}

</div>

`;
      });

      document.getElementById("activities").innerHTML =
        logsHtml || "No activities";

      // ====================
      // LOGOUT
      // ====================

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("passportUser");

        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
